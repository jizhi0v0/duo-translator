name: DuoTranslator
options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.0"

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "3.0.0"

configFiles:
  Debug: Configs/Debug.xcconfig
  Release: Configs/Release.xcconfig

targets:
  DuoTranslator:
    type: application
    platform: macOS
    sources:
      - Sources
    configFiles:
      Debug: Configs/Debug.xcconfig
      Release: Configs/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.bobby.DuoTranslator
        PRODUCT_NAME: DuoTranslator
        INFOPLIST_FILE: Configs/Info.plist
        CODE_SIGN_ENTITLEMENTS: Configs/DuoTranslator.entitlements
    dependencies:
      - package: KeyboardShortcuts
    scheme:
      testTargets:
        - DuoTranslatorTests
        - DuoTranslatorUITests

  DuoTranslatorTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.bobby.DuoTranslatorTests
    dependencies:
      - target: DuoTranslator

  DuoTranslatorUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - UITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.bobby.DuoTranslatorUITests
        TEST_TARGET_NAME: DuoTranslator
    dependencies:
      - target: DuoTranslator
